# Run the whole site with Docker:   docker compose up -d --build   →   http://localhost:9000
# First start: the admin password is printed in the log →  docker compose logs paraph
services:
  paraph:
    build: .
    ports:
      - "9000:80"
    environment:
      TRUST_PROXY: "0"            # reached directly, not through a proxy
      # ADMIN_USERNAME: admin
      # ADMIN_PASSWORD: choose-a-strong-password
    volumes:
      - paraph-data:/var/www/html/storage   # database survives restarts and rebuilds
    restart: unless-stopped

volumes:
  paraph-data:
